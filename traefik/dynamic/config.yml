tls:
  certificates:
    - certFile: "/caddy_certs/caddy/certificates/acme.zerossl.com-v2-dv90/codabench.univ-grenoble-alpes.fr/codabench.univ-grenoble-alpes.fr.crt"
      keyFile: "/caddy_certs/caddy/certificates/acme.zerossl.com-v2-dv90/codabench.univ-grenoble-alpes.fr/codabench.univ-grenoble-alpes.fr.key"

tcp:
  routers:
    rabbitmq-tls:
      rule: "HostSNI('*')"
      # rule: "HostSNI(`codabench.univ-grenoble-alpes.fr`)"
      entryPoints:
        - "amqp"
      tls:
        passthrough: false # Traefik decrypts using the certificates above
      service: rabbitmq-service

  services:
    rabbitmq-service:
      loadBalancer:
        servers:
          - address: "rabbit:5672"